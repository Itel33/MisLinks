<!DOCTYPE html>
<html lang="es">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#151310;--text:#f5f0e9;--muted:#b7afa4;--line:rgba(245,240,233,.2);--panel:rgba(255,255,255,.055);--panel-hover:rgba(255,255,255,.12)}
*,*::before,*::after{box-sizing:inherit}
body{min-height:100vh;min-height:100svh;margin:0;background:radial-gradient(ellipse at 18% 12%,rgba(119,78,62,.3),transparent 40%),radial-gradient(ellipse at 85% 78%,rgba(94,82,59,.2),transparent 38%),var(--bg);color:var(--text);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
main{position:relative;width:100%;max-width:680px;min-height:100vh;min-height:100svh;margin:0 auto;padding:clamp(36px,8vh,88px) clamp(18px,4vw,32px);display:flex;flex-direction:column;justify-content:center;transition:transform .48s cubic-bezier(.2,.8,.2,1)}
main::before{position:absolute;z-index:-1;top:50%;left:50%;width:min(78vw,420px);height:min(78vw,420px);border:1px solid rgba(226,193,157,.08);border-radius:50%;content:"";transform:translate(-50%,-55%);box-shadow:0 0 100px rgba(153,104,75,.09)}
.eyebrow{margin:0 0 18px;text-align:center;color:#d0aa86;font-size:.7rem;font-weight:600;letter-spacing:.2em}
h1{margin:0;text-align:center;font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:clamp(1.7rem,7vw,3.2rem);line-height:1.12;letter-spacing:-.045em}
.social{display:flex;justify-content:center;gap:12px;margin:24px 0 42px}
.social a{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:var(--panel);transition:background .2s,border-color .2s,transform .2s}
.social a:hover{transform:translateY(-2px);border-color:rgba(245,240,233,.5);background:var(--panel-hover)}
.social svg{width:24px;height:24px;display:block}
.links{display:flex;flex-direction:column;gap:14px;counter-reset:link}
.card{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;gap:16px;min-height:clamp(116px,15vw,148px);padding:0 clamp(18px,3vw,26px);border:1px solid var(--line);border-radius:5px;background-color:var(--panel);background-position:center 45%;background-size:cover;color:var(--text);text-decoration:none;text-transform:uppercase;font-size:.87rem;font-weight:500;letter-spacing:.12em;transition:background-color .2s,border-color .2s,transform .2s}
.card:nth-child(1){border-color:rgba(222,177,130,.4);background-image:linear-gradient(90deg,rgba(36,25,17,.76),rgba(108,70,37,.28)),url("https://lnvuperyctbuquqvaufw.supabase.co/storage/v1/object/public/gallery/general/1792367039061-20250601_140425-0-.jpg");background-size:auto,112% auto}
.card:nth-child(2){border-color:rgba(255,145,82,.28);background-image:linear-gradient(90deg,rgba(28,19,15,.8),rgba(105,54,30,.2)),url("https://lnvuperyctbuquqvaufw.supabase.co/storage/v1/object/public/gallery/hotrack/1789192826282-dsc_0134.jpg");background-size:auto,112% auto}
.card-art{position:absolute;z-index:-1;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);opacity:.85}
.card-art img{min-width:0;min-height:0;width:100%;height:100%;object-fit:cover}
.card-art::after{position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,16,14,.88),rgba(18,16,14,.22)),linear-gradient(90deg,transparent 17%,rgba(18,16,14,.38) 25%,transparent 33%,transparent 42%,rgba(18,16,14,.38) 50%,transparent 58%,transparent 67%,rgba(18,16,14,.38) 75%,transparent 83%);content:""}
.card:nth-child(4) .card-art{grid-template-columns:repeat(2,minmax(0,1fr))}
.card:nth-child(4) .card-art::after{background:linear-gradient(90deg,rgba(18,16,14,.3),rgba(18,16,14,.04)),linear-gradient(90deg,transparent 38%,rgba(18,16,14,.42) 50%,transparent 62%)}
.card:nth-child(4) .card-art img:first-child{object-position:center 38%}
.card:nth-child(4) .card-art img:last-child{object-position:center 13%}
.card:nth-child(3){border-color:rgba(222,222,222,.42)}
.card:nth-child(3) .card-art img{filter:grayscale(.78)}
.card:nth-child(3) .card-art::after{background:linear-gradient(90deg,rgba(18,18,18,.72),rgba(18,18,18,.12)),linear-gradient(90deg,transparent 17%,rgba(18,18,18,.38) 25%,transparent 33%,transparent 42%,rgba(18,18,18,.38) 50%,transparent 58%,transparent 67%,rgba(18,18,18,.38) 75%,transparent 83%)}
.card:nth-child(4){border-color:rgba(29,185,84,.48)}
.card:nth-child(4) .card-art::after{background:linear-gradient(90deg,rgba(5,35,20,.36),rgba(5,35,20,.1)),linear-gradient(90deg,transparent 38%,rgba(5,35,20,.42) 50%,transparent 62%)}
.card:nth-child(2)::before{color:#d9a17f}
.card:nth-child(4)::before{color:#8ce0a7}
.brand-mark{width:29px;height:29px;flex:none;margin-left:auto}
.card:nth-child(1)::after,.card:nth-child(3)::after,.card:nth-child(4)::after{margin-left:0}
.gallery-mark{color:#e5b47e}
.vsco-mark{width:29px;height:29px;object-fit:contain}
.hotrack-icon{width:50px;height:50px;margin-left:auto;margin-right:-6px;object-fit:contain;opacity:1}
.spotify-mark{width:29px;height:29px;object-fit:contain}
.card::after{margin-left:auto;content:"↗";color:var(--muted);font-size:1.1rem;transition:color .2s,transform .2s}
.card:nth-child(2)::after{margin-left:0}
.card:hover{transform:translateY(-2px);border-color:rgba(245,240,233,.5);background-color:var(--panel-hover)}
.card:hover::after{transform:translate(2px,-2px);color:var(--text)}
.card:focus-visible,.social a:focus-visible{outline:2px solid #d0aa86;outline-offset:4px}
@media (max-width:420px){main{padding:38px 18px}.social{margin:20px 0 34px}.links{gap:12px}.card{min-height:116px;padding-right:17px;padding-left:17px;font-size:.82rem}.brand-mark{width:27px;height:27px}.hotrack-icon{width:46px;height:46px;margin-right:-5px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
html.rubber-scroll{overscroll-behavior-y:none}
</style>
</head>
<body>

<script>
const main = document.querySelector("main");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

if (!reducedMotion) {
  let lastTouchY = null;
  let pullOffset = 0;

  document.documentElement.classList.add("rubber-scroll");

  const releasePull = () => {
    pullOffset = 0;
    main.style.transition = "";
    main.getBoundingClientRect();
    main.style.transform = "";
  };

  window.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) {
      lastTouchY = null;
      releasePull();
      return;
    }

    lastTouchY = event.touches[0].clientY;
    main.style.transition = "none";
  }, { passive: true });

  window.addEventListener("touchmove", event => {
    if (lastTouchY === null || event.touches.length !== 1) return;

    const currentY = event.touches[0].clientY;
    const deltaY = currentY - lastTouchY;
    lastTouchY = currentY;

    const atTop = window.scrollY <= 0;
    const atBottom = window.scrollY + window.innerHeight >= document.documentElement.scrollHeight - 1;
    if ((atTop && deltaY > 0) || (atBottom && deltaY < 0)) {
      event.preventDefault();
      pullOffset = Math.max(-64, Math.min(64, pullOffset + deltaY * 0.42));
      main.style.transform = `translate3d(0, ${pullOffset}px, 0)`;
    }
  }, { passive: false });

  const finishTouch = () => {
    lastTouchY = null;
    releasePull();
  };

  window.addEventListener("touchend", finishTouch, { passive: true });
  window.addEventListener("touchcancel", finishTouch, { passive: true });

  window.addEventListener("wheel", event => {
    const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
    if (maxScroll <= 0) return;

    let bounce = 0;
    if (window.scrollY <= 0 && event.deltaY < 0) bounce = Math.min(12, -event.deltaY * 0.08);
    if (window.scrollY >= maxScroll - 1 && event.deltaY > 0) bounce = -Math.min(12, event.deltaY * 0.08);
    if (bounce === 0) return;

    main.style.transition = "none";
    main.style.transform = `translate3d(0, ${bounce}px, 0)`;
    window.requestAnimationFrame(() => {
      main.style.transition = "";
      main.getBoundingClientRect();
      main.style.transform = "";
    });
  }, { passive: true });
}
</script>
